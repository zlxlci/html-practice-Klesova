<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="./table-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Таблица геометрических фигур</h1>

    <table class="shapes-table">
        <tr class="row-titles">
            <th>Квадрат</th>
            <th>Круг</th>
            <th>Прямоугольник</th>
        </tr>

        <tr class="row-shapes">
            <td><div class="shape red-square"></div></td>
            <td><div class="shape cyan-circle"></div></td>
            <td><div class="shape blue-rectangle"></div></td>
        </tr>
    </table>

    <div class="back-box">
        <a href="./index.html"><button class="btn-back">Вернуться на главную</button></a>
    </div>
</body>
</html>
