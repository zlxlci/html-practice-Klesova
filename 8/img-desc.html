<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img</title>
    <link rel="stylesheet" href="./img-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Тег img</h1>
    <p>Тег <strong>img</strong> предназначен для отображения на веб-странице изображений. Он является одиночным и требует обязательный атрибут src, в котором указывается путь к файлу картинки</p>

    <h3>Пример использования (Тема: Города):</h3>
    <div class="gallery">
        <img src="./images/city1.jpeg" alt="city">
        <img src="./images/city2.jpeg" alt="city">
        <img src="./images/city3.jpeg" alt="city">
    </div>

    <div class="back-box">
        <a href="./index.html"><button class="btn-back">Вернуться на главную</button></a>
    </div>
</body>
</html>
